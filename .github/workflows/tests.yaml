name: Tests
 
on: push
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirement.txt
      - run: playwright install --with-deps chromium
      - run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; find . -type f -name "*.pyc" -delete 2>/dev/null; rm -rf .pytest_cache 2>/dev/null; true
      - run: xvfb-run python -m pytest --cache-clear
